name: Publish CFSM Theme

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-cfsm-theme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-theme-files:
    if: github.ref == 'refs/heads/cfsm-port'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout cfsm-port
        uses: actions/checkout@v6
        with:
          ref: cfsm-port
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CFSM theme
        run: bun run build

      - name: Verify generated theme package
        run: |
          test -s theme.tar.gz
          test -s dist/index.html
          tar -tzf theme.tar.gz

      - name: Publish dist directory and theme package to cfsm-port
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist theme.tar.gz
          if git diff --cached --quiet; then
            echo "No generated theme changes to commit."
          else
            git commit -m "Publish CFSM theme build"
            git push origin HEAD:cfsm-port
          fi
